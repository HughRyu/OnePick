<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>OnePick Login</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2.4.68" />
  <style>
    :root {
      color-scheme: light;
      --bg: #f3f1ea;
      --surface: #fff;
      --surface-soft: #faf9f4;
      --text: #2e2e2e;
      --muted: #8a8a85;
      --faint: #b3b0a8;
      --line: #e4e0d8;
      --line-soft: #eeeae2;
      --mint: #9fdbc4;
      --mint-hover: #aee6d0;
      --mint-active: #8ccfb6;
      --mint-ink: #235f4c;
      --mint-tint: #eef8f3;
      --mint-ring: rgba(127, 224, 192, 0.55);
      --danger: #a54b4b;
      --e2: 0 4px 12px rgba(70, 60, 40, 0.08);
      --e4: 0 14px 30px rgba(70, 60, 40, 0.12);
      --clay-in: inset 0 1px 1px rgba(255, 255, 255, 0.7);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 22px;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif;
      color: var(--text);
      background:
        radial-gradient(900px 500px at 80% -10%, rgba(159, 219, 196, 0.16), transparent 60%),
        var(--bg);
    }
    main {
      width: min(420px, 100%); border: 1px solid var(--line); border-radius: 24px;
      background: var(--surface); box-shadow: var(--e4), var(--clay-in); padding: 34px;
    }
    .brand { display: grid; justify-items:center; gap: 10px; font-weight: 850; margin-bottom:24px; }
    .mark {
      display: block; width: 72px; height: 72px; border-radius: 22px;
      box-shadow: 0 10px 24px rgba(35,95,76,.16), var(--e2);
    }
    .eyebrow { margin: 26px 0 8px; color: var(--mint-ink); font-size: 12px; font-weight: 850; letter-spacing: .1em; text-transform: uppercase; }
    h1 { margin: 0; font-size: 28px; line-height: 1.1; letter-spacing: -0.01em; font-weight: 850; }
    p { color: var(--muted); line-height: 1.6; }
    form { display: grid; gap: 14px; margin-top: 22px; }
    label { color: var(--muted); font-size: 12px; font-weight: 850; letter-spacing: .04em; text-transform: uppercase; }
    input {
      width: 100%; border: 1px solid var(--line); border-radius: 14px;
      background: var(--surface-soft); color: var(--text); padding: 13px 15px; font: inherit; outline: none;
      box-shadow: inset 0 2px 4px rgba(70, 60, 40, 0.04);
      transition: border-color .16s ease, box-shadow .16s ease, background .16s ease;
    }
    input:focus { border-color: var(--mint); background: #fff; box-shadow: 0 0 0 4px var(--mint-ring); }
    input::placeholder { color: var(--faint); }
    button {
      min-height: 46px; border: 0; border-radius: 999px; padding: 11px 18px;
      color: var(--mint-ink); background: var(--mint); font: inherit; font-weight: 850; cursor: pointer;
      box-shadow: var(--e2), var(--clay-in);
      transition: background .16s ease, transform .16s ease, box-shadow .16s ease;
    }
    button:hover { background: var(--mint-hover); transform: translateY(-1px); }
    button:active { background: var(--mint-active); transform: translateY(0); }
    .error { color: var(--danger); font-weight: 700; }
    .hint { font-size: 13px; }
    .wordmark{font-family:Georgia,'Times New Roman',serif;font-size:42px;font-weight:850;font-style:italic;letter-spacing:-.03em;line-height:1;background:linear-gradient(115deg,#244C9A,#1496A3 52%,#8FD34F);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:0 12px 28px rgba(35,95,76,.14)}
  </style>
</head>
<body>
  <main>
    <div class="brand"><img class="mark" src="/logo.svg?v=2.4.68" alt="" width="72" height="72" /><span class="wordmark">OnePick</span></div>

    <form id="login-form">
      <div>
        <label for="username">用户名</label>
        <input id="username" name="username" autocomplete="username" value="hugh" required />
      </div>
      <div>
        <label for="password">密码</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required autofocus />
      </div>
      <button type="submit">登录</button>
      <p id="message" class="error" hidden></p>
    </form>
  </main>
  <script>
    const form = document.querySelector('#login-form');
    const message = document.querySelector('#message');
    const next = new URLSearchParams(location.search).get('next') || '/';

    form.addEventListener('submit', async event => {
      event.preventDefault();
      message.hidden = true;
      const body = Object.fromEntries(new FormData(form));
      const response = await fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });
      const payload = await response.json().catch(() => ({}));
      if (!response.ok) {
        message.textContent = payload.error || '登录失败。';
        message.hidden = false;
        return;
      }
      location.href = next;
    });
  </script>
</body>
</html>
